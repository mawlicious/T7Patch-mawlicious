name: Build T7Patch-mawlicious
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Test timeout guards and readback
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /MT tests\test_timeout.cpp /Fe:test-timeout-mawlicious.exe
          if errorlevel 1 exit /b 1
          test-timeout-mawlicious.exe
      - name: Build patch
        shell: cmd
        run: msbuild T7Patch.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:SolutionDir="%CD%/" /m
      - name: Test real patch dependencies and exception continuation
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /MT tests\test_dependencies.cpp /Fe:test-dependencies-mawlicious.exe
          if errorlevel 1 exit /b 1
          test-dependencies-mawlicious.exe x64\Release\T7Patch-mawlicious.dll x64\Release\T7Patch-mawlicious.map
      - name: Build launcher
        shell: cmd
        run: cl /nologo /std:c++20 /EHsc /W4 /MT /O2 launcher\main.cpp /Fe:T7Patch-mawlicious.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib
      - name: Test shutdown during attachment
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /MT /LD tests\attach_fixture.cpp /Fe:attach-fixture-mawlicious.dll
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /W4 /MT tests\test_attach.cpp /Fe:test-attach-mawlicious.exe /link /SUBSYSTEM:CONSOLE /ENTRY:mainCRTStartup user32.lib gdi32.lib
          if errorlevel 1 exit /b 1
          test-attach-mawlicious.exe
      - name: Test settings save during file contention
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /MT tests\test_config.cpp /Fe:test-config-mawlicious.exe
          if errorlevel 1 exit /b 1
          test-config-mawlicious.exe
      - name: Test settings window and persistence
        shell: pwsh
        run: ./tests/test-launcher.ps1
      - name: Package
        shell: pwsh
        run: |
          $folder = 'release/T7Patch-mawlicious'
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item x64/Release/T7Patch-mawlicious.dll, T7Patch-mawlicious.exe, README.md, UPSTREAM.md, t7patch-mawlicious.conf $folder
          Compress-Archive -Path $folder -DestinationPath release/T7Patch-mawlicious-windows-x64.zip
          $hash = (Get-FileHash release/T7Patch-mawlicious-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  T7Patch-mawlicious-windows-x64.zip" | Set-Content release/SHA256SUMS -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: T7Patch-mawlicious-windows-x64
          path: |
            release/T7Patch-mawlicious-windows-x64.zip
            release/SHA256SUMS
            release/launcher-mawlicious.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T7Patch-mawlicious-debug-symbols
          path: |
            x64/Release/*.pdb
            x64/Release/*.map
